<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer · Classroom Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f3f6fa; --ink: #16233f; --muted: #5b6784; --correct: #2f8f5b; --partial: #e0a800; --incorrect: #c8435a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 1.7rem; line-height: 1.15; margin: 0 0 20px; }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }
  input, textarea { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px; border: 2px solid #c9d1df; border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  button { margin-top: 16px; width: 100%; font: inherit; font-weight: 700; font-size: 1.1rem; padding: 14px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 3px solid var(--partial); outline-offset: 2px; }
  .result { margin-top: 22px; padding: 16px; border-radius: 10px; background: #fff; border-left: 6px solid var(--c, var(--muted)); display: none; }
  .result h2 { margin: 0 0 6px; font-size: 1.2rem; }
  .result p { margin: 0; }
  .small { font-size: .85rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="prompt">Loading question…</h1>
  <form id="f">
    <label for="name">Your first name (optional)</label>
    <input id="name" maxlength="30" autocomplete="given-name">
    <label for="text">Your answer</label>
    <textarea id="text" maxlength="500" required placeholder="Explain it in your own words"></textarea>
    <button id="send" type="submit">Send answer</button>
  </form>
  <div class="result" id="result" role="status" aria-live="polite"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // Poll so students see the follow-up question when the teacher starts the next round.
  let currentRound = null;
  async function syncQuestion() {
    try {
      const q = await (await fetch("/api/question")).json();
      if (q.round !== currentRound) {
        if (currentRound !== null) { $("text").value = ""; $("result").style.display = "none"; $("send").textContent = "Send answer"; }
        currentRound = q.round;
        $("prompt").textContent = q.prompt;
      }
    } catch {}
  }
  syncQuestion(); setInterval(syncQuestion, 3000);
  const verdict = {
    correct: ["Nailed it", "var(--correct)"],
    partial: ["Partly there", "var(--partial)"],
    incorrect: ["Not quite yet", "var(--incorrect)"],
  };
  $("f").onsubmit = async (e) => {
    e.preventDefault();
    $("send").disabled = true; $("send").textContent = "Sending…";
    try {
      const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: $("name").value, text: $("text").value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Something went wrong");
      const [title, c] = d.judgment.off_topic ? ["That doesn't look like an answer", "var(--muted)"] : (verdict[d.judgment.correctness] || ["Answer received", "var(--muted)"]);
      const box = $("result");
      box.style.setProperty("--c", c);
      box.innerHTML = `<h2>${title}</h2>${d.hint ? `<p>${d.hint.replace(/</g, "&lt;")}</p>` : ""}<p class="small">Judged in ${d.latency_ms} ms</p>`;
      box.style.display = "block";
      $("send").textContent = "Send another answer";
    } catch (err) {
      $("send").textContent = "Try again";
      alert("Your answer didn't go through: " + err.message);
    } finally { $("send").disabled = false; }
  };
</script>
</body>
</html>
